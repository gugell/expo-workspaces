name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Plan example apps
        run: |
          for example in examples/share-extension examples/widget examples/native-dependencies examples/multi-scheme examples/android-gradle examples/android-manifest; do
            echo "::group::$example"
            node bin/expo-workspaces.js --project "$example" validate
            node bin/expo-workspaces.js --project "$example" plan --json > /tmp/plan.json
            echo "::endgroup::"
          done
      - name: Verify committed bundle is in sync (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- build; then
            echo "::error::Committed bundle is stale. Run 'pnpm build' and commit ./build."
            git diff --stat -- build
            exit 1
          fi

  bundle-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Refresh bundle if drifted
        run: |
          if git diff --quiet -- build; then
            echo "Bundle already in sync."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build
            git commit -m "chore: rebuild bundle [skip ci]"
            git push
          fi
